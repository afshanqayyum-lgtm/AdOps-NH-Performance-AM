<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Performance Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 13px; background: #f5f5f5; color: #222; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 280px; flex-shrink: 0; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; height: 100vh; }
.sidebar-header { background: #6a0dad; color: #EEEDFE; padding: 14px 16px; font-size: 15px; font-weight: bold; flex-shrink: 0; }
.sidebar-meta { font-size: 10px; color: #c8a8f0; margin-top: 3px; }
.filters { flex: 1; overflow-y: auto; padding-bottom: 8px; }
.section { border-bottom: 1px solid #eee; padding: 10px 14px; }
.section-title { font-weight: bold; font-size: 11px; color: #6a0dad; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mini-btns { display: flex; gap: 4px; }
.mini-btn { font-size: 10px; padding: 2px 6px; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; background: #f5f5f5; }
.mini-btn:hover { background: #ddd; }
.search-wrap { position: relative; margin-bottom: 5px; }
.search-box { width: 100%; padding: 5px 26px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; background: #fafafa; outline: none; }
.search-box:focus { border-color: #9b59b6; }
.search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 11px; pointer-events: none; }
.search-clear { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); color: #aaa; cursor: pointer; font-size: 11px; display: none; background: none; border: none; }
.cb-list { max-height: 120px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
.cb-label { display: flex; align-items: center; padding: 4px 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 12px; }
.cb-label:last-child { border-bottom: none; }
.cb-label:hover { background: #f3e5ff; }
.cb-label input { margin-right: 7px; accent-color: #6a0dad; flex-shrink: 0; }
.cb-label.hidden { display: none; }
.count-line { font-size: 10px; color: #999; margin-top: 3px; }
.cascade-note { font-size: 10px; color: #9b59b6; font-style: italic; margin-top: 2px; }
.placeholder { padding: 7px 10px; font-size: 12px; color: #aaa; font-style: italic; }
.sidebar-footer { flex-shrink: 0; padding: 10px 14px; border-top: 2px solid #eee; }
.btn-apply { width: 100%; background: #6a0dad; color: #fff; border: none; padding: 11px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 7px; }
.btn-apply:hover { background: #4a0080; }
.btn-row { display: flex; gap: 7px; }
.btn-sm { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; color: #444; cursor: pointer; font-size: 12px; }
.btn-sm:hover { background: #eee; }
.status { font-size: 11px; color: #6a0dad; text-align: center; min-height: 15px; margin-top: 5px; }
.main { flex: 1; overflow-y: auto; padding: 20px; min-width: 0; }
.main-header { background: #6a0dad; color: #EEEDFE; padding: 14px 20px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 16px; }
.filter-summary { background: #f3e5ff; border: 1px solid #d7a8f0; border-radius: 6px; padding: 10px 16px; margin-bottom: 16px; font-size: 12px; }
.filter-summary table { border-collapse: collapse; width: 100%; }
.filter-summary td { padding: 2px 8px 2px 0; vertical-align: top; }
.filter-summary td:first-child { font-weight: bold; color: #6a0dad; white-space: nowrap; width: 100px; }
.filter-summary .val-all { color: #999; font-style: italic; }
.filter-summary .val-set { color: #222; }
.no-data { padding: 20px; color: #999; font-style: italic; text-align: center; background: #fff; border-radius: 8px; }
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #9b59b6; font-size: 16px; }
.product-section { margin-bottom: 24px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.product-header { padding: 12px 16px; font-weight: bold; font-size: 14px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { padding: 7px 10px; text-align: left; background: #3c3c3c; color: #fff; font-size: 11px; font-weight: bold; white-space: nowrap; border: 1px solid #555; }
.data-table td { padding: 6px 10px; border: 1px solid #e5e5e5; white-space: nowrap; }
.data-table .num { text-align: right; }
.data-table tr:nth-child(even) td { background: #f9f9f9; }
.data-table tr:hover td { background: #f0e8ff; }
.totals-row td { font-weight: bold; border-top: 2px solid #999; }
.subject-cell { white-space: normal; max-width: 250px; min-width: 150px; }
.targeting-cell { white-space: nowrap; font-size: 11px; color: #6a0dad; font-weight: 600; }
</style>
</head>

      <div class="section-title">4. Product <div class="mini-btns"><button class="mini-btn" onclick="allIn('product')">All</button><button class="mini-btn" onclick="noneIn('product')">None</button></div></div>
      <div class="cb-list" id="list-product"><div class="placeholder">Select a development first</div></div>
      <div class="count-line" id="count-product"></div>
      <div class="cascade-note" id="note-product"></div>
    </div>
    <div class="section">
      <div class="section-title">5. CIN <div class="mini-btns"><button class="mini-btn" onclick="allIn('cin')">All</button><button class="mini-btn" onclick="noneIn('cin')">None</button></div></div>
      <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-box" id="search-cin" placeholder="Search..."><button class="search-clear" id="clear-cin" onclick="clearSearch('cin')">✕</button></div>
      <div class="cb-list" id="list-cin"><div class="placeholder">Select filters above</div></div>
      <div class="count-line" id="count-cin"></div>
    </div>
    <div class="section">
      <div class="section-title">6. Month <div class="mini-btns"><button class="mini-btn" onclick="allIn('month')">All</button><button class="mini-btn" onclick="noneIn('month')">None</button></div></div>
      <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-box" id="search-month" placeholder="Search..."><button class="search-clear" id="clear-month" onclick="clearSearch('month')">✕</button></div>
      <div class="cb-list" id="list-month"><div class="placeholder">Select filters above</div></div>
      <div class="count-line" id="count-month"></div>
    </div>
  </div>
  <div class="sidebar-footer">
    <button class="btn-apply" onclick="applyFilters()">Apply and Refresh</button>
    <button class="btn-apply" onclick="downloadExcel()" style="background:#1d7a4a;margin-top:8px">⬇ Download Excel</button>
    <div class="btn-row">
      <button class="btn-sm" onclick="clearAll()">Clear All</button>
      <button class="btn-sm" onclick="showAll()">Show All</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<div class="main" id="main">
  <div class="main-header">Client Performance Dashboard</div>
  <div class="filter-summary" id="filter-summary" style="display:none"></div>
  <div id="content"><div class="loading">Loading data...</div></div>
</div>
<script>
var D = null;
var HIERARCHY = {}, SORTED_MONTHS = [], MONTH_INDEX = {}, ALL_PRODUCTS = [], PRODUCT_METRICS = {};
var COLOURS = {
  'Email Campaign':       {header:'#1a5276',headerText:'#D6EAF8',alt:'#EBF5FB',total:'#AED6F1',totalText:'#1a5276'},
  'HOTW Boost':           {header:'#1a5276',headerText:'#D6EAF8',alt:'#EBF5FB',total:'#AED6F1',totalText:'#1a5276'},
  'Facebook CPC':         {header:'#1a6b4a',headerText:'#D5F5E3',alt:'#EAFAF1',total:'#A9DFBF',totalText:'#1a6b4a'},
  'Facebook CPL':         {header:'#1a6b4a',headerText:'#D5F5E3',alt:'#EAFAF1',total:'#A9DFBF',totalText:'#1a6b4a'},
  'Facebook CTW':         {header:'#1a6b4a',headerText:'#D5F5E3',alt:'#EAFAF1',total:'#A9DFBF',totalText:'#1a6b4a'},
  'Gateway':              {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'In-Search':            {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'Leaderboard':          {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'Property Sponsorship': {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'Area Sponsorship':     {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'Display':              {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'HPTO':                 {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
  'GDN':                  {header:'#7d3c98',headerText:'#F4ECF7',alt:'#F9F0FF',total:'#D7BDE2',totalText:'#7d3c98'},
};
(function() {
  if (typeof __CD_DATA__ === 'undefined') {
    document.getElementById('content').innerHTML = '<div class="no-data">No data available.</div>';
    return;
  }
  D = __CD_DATA__;
  HIERARCHY = D.hierarchy; SORTED_MONTHS = D.sortedMonths;
  MONTH_INDEX = D.monthIndex; ALL_PRODUCTS = D.allProducts; PRODUCT_METRICS = D.productMetrics;
  document.getElementById('sidebar-meta').textContent = 'Updated ' + D.generated;
  setupSearch('parent'); setupSearch('account'); setupSearch('development'); setupSearch('cin'); setupSearch('month');
  renderList('parent', Object.keys(HIERARCHY).sort(), []);
  refreshCins();
  refreshMonths();
  renderDashboard();
})();
function renderList(name, items, checked) {
  var c = document.getElementById('list-' + name);
  if (!items.length) { c.innerHTML = '<div class="placeholder">No options</div>'; updateCount(name); return; }
  c.innerHTML = items.map(function(item) {
    var s = esc(item);
    var chk = checked.indexOf(item) > -1 ? ' checked' : '';
    var cb = '<label class="cb-label">';
    cb += '<input type="checkbox" name="' + name + '" value="' + s + '"' + chk;
    cb += ' onchange="onCheck(\'' + name + '\')">';
    cb += '<span>' + s + '</span></label>';
    return cb;
  }).join('');
  updateCount(name); applySearch(name);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setupSearch(name) {
  var el = document.getElementById('search-'+name);
  if (el) el.addEventListener('input', function() { applySearch(name); });
}
function applySearch(name) {
  var term = ((document.getElementById('search-'+name)||{}).value||'').toLowerCase();
  var clr = document.getElementById('clear-'+name);
  if (clr) clr.style.display = term ? 'inline' : 'none';
  document.querySelectorAll('#list-'+name+' .cb-label').forEach(function(l) {
    l.classList.toggle('hidden', (l.querySelector('span')||{}).textContent.toLowerCase().indexOf(term) === -1);
  });
}
function clearSearch(name) { var el=document.getElementById('search-'+name); if(el)el.value=''; applySearch(name); }
function getChecked(name) { return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(i){return i.value;}); }
function getValidAccounts() {
  var sp=getChecked('parent'), parents=sp.length?sp:Object.keys(HIERARCHY), accs={};
  parents.forEach(function(p){if(HIERARCHY[p])Object.keys(HIERARCHY[p]).forEach(function(a){accs[a]=true;});});
  return Object.keys(accs).sort();
}
function getValidDevs() {
  var sp=getChecked('parent'),sa=getChecked('account'),parents=sp.length?sp:Object.keys(HIERARCHY),devs={};
  parents.forEach(function(p){if(!HIERARCHY[p])return;var accs=sa.length?sa:Object.keys(HIERARCHY[p]);accs.forEach(function(a){if(HIERARCHY[p][a])Object.keys(HIERARCHY[p][a]).forEach(function(d){devs[d]=true;});});});
  return Object.keys(devs).sort();
}
function getValidProducts() {
  var sp=getChecked('parent'),sa=getChecked('account'),sd=getChecked('development'),parents=sp.length?sp:Object.keys(HIERARCHY),prods={};
  parents.forEach(function(p){if(!HIERARCHY[p])return;var accs=sa.length?sa:Object.keys(HIERARCHY[p]);accs.forEach(function(a){if(!HIERARCHY[p][a])return;var devs=sd.length?sd:Object.keys(HIERARCHY[p][a]);devs.forEach(function(d){if(HIERARCHY[p][a][d])HIERARCHY[p][a][d].forEach(function(pr){prods[pr]=true;});});});});
  return ALL_PRODUCTS.filter(function(p){return prods[p];});
}
function refreshCins() {
  var sp=getChecked('parent'),sa=getChecked('account'),sd=getChecked('development'),sprod=getChecked('product'),sm=getChecked('month'),prev=getChecked('cin');
  var allRows=[].concat(D.sf,D.fb,D.gam);
  var valid=[...new Set(allRows.filter(function(r){
    return(!sp.length||sp.indexOf(r.parent)>-1)&&(!sa.length||sa.indexOf(r.account)>-1)&&(!sd.length||sd.indexOf(r.dev)>-1)&&(!sprod.length||sprod.indexOf(r.product)>-1)&&(!sm.length||sm.indexOf(r.month)>-1)&&r.cin;
  }).map(function(r){return r.cin;}))].sort();
  renderList('cin',valid,prev.filter(function(c){return valid.indexOf(c)>-1;}));
}
function refreshMonths() {
  var sp=getChecked('parent'),sa=getChecked('account'),sd=getChecked('development'),sprod=getChecked('product'),sc=getChecked('cin'),prev=getChecked('month');
  var valid=SORTED_MONTHS.filter(function(m){
    var md=MONTH_INDEX[m]; if(!md)return false;
    if(sp.length&&!sp.some(function(p){return md.parents.indexOf(p)>-1;}))return false;
    if(sa.length&&!sa.some(function(a){return md.accounts.indexOf(a)>-1;}))return false;
    if(sd.length&&!sd.some(function(d){return md.devs.indexOf(d)>-1;}))return false;
    if(sprod.length&&!sprod.some(function(p){return md.products.indexOf(p)>-1;}))return false;
    if(sc.length){var mCins=[...new Set([].concat(D.sf,D.fb,D.gam).filter(function(r){return r.month===m;}).map(function(r){return r.cin;}))];if(!sc.some(function(c){return mCins.indexOf(c)>-1;}))return false;}
    return true;
  });
  renderList('month',valid,prev.filter(function(m){return valid.indexOf(m)>-1;}));
}
function onCheck(name) {
  updateCount(name);
  if(name==='parent'){var va=getValidAccounts(),pa=getChecked('account').filter(function(a){return va.indexOf(a)>-1;});renderList('account',va,pa);document.getElementById('note-account').textContent=getChecked('parent').length?'Filtered by selected group':'';onCheck('account');}
  if(name==='account'){var vd=getValidDevs(),pd=getChecked('development').filter(function(d){return vd.indexOf(d)>-1;});renderList('development',vd,pd);document.getElementById('note-development').textContent=getChecked('account').length?'Filtered by selected company':'';onCheck('development');}
  if(name==='development'){var vp=getValidProducts(),pp=getChecked('product').filter(function(p){return vp.indexOf(p)>-1;});renderList('product',vp,pp);document.getElementById('note-product').textContent=getChecked('development').length?'Filtered by selected development':'';refreshCins();refreshMonths();}
  if(name==='product'){refreshCins();refreshMonths();}
  if(name==='cin')refreshMonths();
}
function allIn(name){document.querySelectorAll('input[name="'+name+'"]').forEach(function(i){i.checked=true;});onCheck(name);}
function noneIn(name){document.querySelectorAll('input[name="'+name+'"]').forEach(function(i){i.checked=false;});onCheck(name);}
function clearAll(){['parent','account','development','product','month'].forEach(noneIn);}
function showAll(){allIn('parent');}
function updateCount(name){var el=document.getElementById('count-'+name);if(!el)return;var chk=document.querySelectorAll('input[name="'+name+'"]:checked').length,tot=document.querySelectorAll('input[name="'+name+'"]').length;el.textContent=chk===0?'Showing all':chk+' of '+tot+' selected';}
function downloadExcel() {
  
  var sp=getChecked('parent'),sa=getChecked('account'),sd=getChecked('development'),sprods=getChecked('product'),sm=getChecked('month');
  var sc=getChecked('cin');
  function matchRow(r){return(!sp.length||sp.indexOf(r.parent)>-1)&&(!sa.length||sa.indexOf(r.account)>-1)&&(!sd.length||sd.indexOf(r.dev)>-1)&&(!sm.length||sm.indexOf(r.month)>-1)&&(!sc.length||sc.indexOf(r.cin)>-1);}
  var productsToShow=sprods.length?sprods:D.allProducts||[];
  var allRows=[].concat(
    D.sf.filter(function(r){return matchRow(r)&&(!sprods.length||sprods.indexOf(r.product)>-1);}),
    D.fb.filter(function(r){return matchRow(r)&&(!sprods.length||sprods.indexOf(r.product)>-1);}),
    D.gam.filter(function(r){return matchRow(r)&&(!sprods.length||sprods.indexOf(r.product)>-1);})
  );
  var rows=allRows.filter(function(r){
    return (r.impressions||0)>0||(r.clicks||0)>0||(r.sends||0)>0;
  });

  if (!rows.length) { alert('No data to export'); return; }

  
  var headers = ['Month','Product','Group','Company','Development','CIN','Targeting','Sends','Opens','Clicks','Impressions','Leads','Platform Cost','Open Rate %','CTR %','CR %'];
  var csvRows = [headers.join(',')];
  rows.forEach(function(r) {
    var imp=r.impressions||0,clk=r.clicks||0,leads=r.leads||0,cost=r.cost||0,sends=r.sends||0,opens=r.opens||0;
    var or=sends?((opens/sends)*100).toFixed(2):'';
    var ctr=imp?(clk/imp*100).toFixed(2):sends?(clk/sends*100).toFixed(2):'';
    var cr=clk?(leads/clk*100).toFixed(2):'';
    var row=[
      fmtMonth(r.month),
      r.product||'',
      r.parent||'',
      r.account||'',
      r.dev||'',
      r.cin||'',
      r.targeting||'',
      sends,opens,clk,imp,leads,cost.toFixed(2),or,ctr,cr
    ].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';});
    csvRows.push(row.join(','));
  });

  var csv = '\uFEFF' + csvRows.join('\n'); 
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'AM_Performance_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function applyFilters(){renderDashboard();document.getElementById('status').textContent='Updated!';setTimeout(function(){document.getElementById('status').textContent='';},1500);}
function renderDashboard() {
  var sp=getChecked('parent'),sa=getChecked('account'),sd=getChecked('development'),sprods=getChecked('product'),sm=getChecked('month');
  var sc=getChecked('cin');
  function matches(r){return(!sp.length||sp.indexOf(r.parent)>-1)&&(!sa.length||sa.indexOf(r.account)>-1)&&(!sd.length||sd.indexOf(r.dev)>-1)&&(!sm.length||sm.indexOf(r.month)>-1)&&(!sc.length||sc.indexOf(r.cin)>-1);}
  var sfFiltered=D.sf.filter(matches),fbFiltered=D.fb.filter(matches),gamFiltered=D.gam.filter(matches);
  updateSummary(sp,sa,sd,sprods,sm);
  var productsToShow=sprods.length?sprods:ALL_PRODUCTS;
  var html='',anyData=false;
  productsToShow.forEach(function(product){
    var rows;
    if(['Email Campaign','HOTW Boost','GDN'].indexOf(product)>-1){rows=sfFiltered.filter(function(r){return r.product===product;});}
    else if(['Facebook CPC','Facebook CPL','Facebook CTW'].indexOf(product)>-1){var sfR=sfFiltered.filter(function(r){return r.product===product;}),fbR=fbFiltered.filter(function(r){return r.product===product;});rows=fbR.length?fbR:sfR;}
    else if(['In-Search','Property Sponsorship','Area Sponsorship','Leaderboard'].indexOf(product)>-1){rows=sfFiltered.filter(function(r){return r.product===product;}).concat(gamFiltered.filter(function(r){return r.product===product;}));}
    else{rows=gamFiltered.filter(function(r){return r.product===product;});}
    if(!rows.length)return;
    anyData=true;
    html+=buildProductSection(product,rows,sp,sa,sd);
  });
  if(!anyData){html=sprods.length?'<div class="no-data">No data found for the selected filters.</div>':'<div class="no-data">Select filters on the left and click Apply.</div>';}
  document.getElementById('content').innerHTML=html;
}
function updateSummary(sp,sa,sd,sprods,sm){
  var el=document.getElementById('filter-summary');el.style.display='block';
  var rows=[['Group:',sp.length?sp.join(', '):'All',!!sp.length],['Company:',sa.length?sa.join(', '):'All',!!sa.length],['Development:',sd.length?sd.join(', '):'All',!!sd.length],['Product:',sprods.length?sprods.join(', '):'All',!!sprods.length],['Month:',sm.length?sm.join(', '):'All',!!sm.length]];
  el.innerHTML='<table>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td class="'+(r[2]?'val-set':'val-all')+'">'+esc(r[1])+'</td></tr>';}).join('')+'</table>';
}
function buildProductSection(product, rows, sp, sa, sd) {
  var c=COLOURS[product]||COLOURS['GDN'];
  var metrics=PRODUCT_METRICS[product]||[];
  var multiDev=sd.length!==1;
  var showCIN=true;
  var parents=[...new Set(rows.map(function(r){return r.parent;}).filter(Boolean))];
  var accounts=[...new Set(rows.map(function(r){return r.account;}).filter(Boolean))];
  var devs=[...new Set(rows.map(function(r){return r.dev;}).filter(Boolean))];
  var parts=[];
  if(parents.length===1)parts.push(parents[0]);else if(parents.length>1)parts.push(parents.length+' groups');
  if(accounts.length===1)parts.push(accounts[0]);else if(accounts.length>1)parts.push(accounts.length+' companies');
  if(devs.length===1)parts.push(devs[0]);else if(devs.length>1)parts.push(devs.length+' developments');
  var context=parts.length?parts.join(' — '):'All';
  
  rows=rows.filter(function(r){return (r.impressions||0)>0||(r.clicks||0)>0||(r.sends||0)>0;});
  var aggMap={};
  rows.forEach(function(r){
    var key=(r.month||'')+'||'+(r.cin||'')+'||'+(r.dev||'')+'||'+(r.channel||'')+'||'+(r.targeting||'');
    if(!aggMap[key]){
      aggMap[key]=Object.assign({},r,{impressions:0,clicks:0,sends:0,opens:0,leads:0,cost:0});
    }
    aggMap[key].impressions+=(r.impressions||0);
    aggMap[key].clicks+=(r.clicks||0);
    aggMap[key].sends+=(r.sends||0);
    aggMap[key].opens+=(r.opens||0);
    aggMap[key].leads+=(r.leads||0);
    aggMap[key].cost+=(r.cost||0);
  });
  rows=Object.values(aggMap).slice().sort(function(a,b){return parseMonth(a.month)-parseMonth(b.month);});
  var cols=['Month'];
  if(showCIN)cols.push('CIN');
  if(multiDev)cols.push('Development');
  metrics.forEach(function(m){cols.push(m);});
  var thHtml=cols.map(function(col){return '<th class="'+(isNumMetric(col)?'num':'')+'">'+(col==='Subject Line'?'Subject Line':col)+'</th>';}).join('');
  var rowsHtml='';
  var totals=initTotals(metrics,rows);
  rows.forEach(function(row){
    var vals=getRowValues(row,cols,metrics);
    rowsHtml+='<tr>';
    vals.forEach(function(v,i){
      var isNum=isNumMetric(cols[i]);
      var isSubj=cols[i]==='Subject Line';
      var isTgt=cols[i]==='Targeting';
      rowsHtml+='<td class="'+(isNum?'num':'')+(isSubj?' subject-cell':'')+(isTgt?' targeting-cell':'')+'">'+fmtVal(cols[i],v)+'</td>';
    });
    rowsHtml+='</tr>';
  });
  var totHtml='<tr class="totals-row">';
  cols.forEach(function(col){
    if(col==='Month'){totHtml+='<td style="background:'+c.total+';color:'+c.totalText+'"><strong>Total</strong></td>';return;}
    if(col==='CIN'||col==='Development'||col==='Subject Line'||col==='Targeting'){totHtml+='<td style="background:'+c.total+'"></td>';return;}
    var v=totals[col];
    totHtml+='<td class="num" style="background:'+c.total+';color:'+c.totalText+'"><strong>'+fmtVal(col,v)+'</strong></td>';
  });
  totHtml+='</tr>';
  return '<div class="product-section"><div class="product-header" style="background:'+c.header+';color:'+c.headerText+'">'+esc(product)+'   |   '+esc(context)+'</div><table class="data-table"><thead><tr>'+thHtml+'</tr></thead><tbody>'+rowsHtml+totHtml+'</tbody></table></div>';
}
function getRowValues(row, cols, metrics) {
  return cols.map(function(col) {
    if(col==='Month')return fmtMonth(row.month);
    if(col==='CIN')return row.cin||'';
    if(col==='Development')return row.dev||'';
    if(col==='Targeting')return row.targeting||'';
    if(col==='Channel')return row.channel||'';
    if(col==='Sends')return row.sends||0;
    if(col==='Opens')return row.opens||0;
    if(col==='Clicks')return row.clicks||0;
    if(col==='Subject Line')return row.subject||'';
    if(col==='Open Rate')return row.sends?row.opens/row.sends*100:'';
    if(col==='CTOR')return row.opens?row.clicks/row.opens*100:'';
    if(col==='Impressions')return row.impressions||0;
    if(col==='Leads')return row.leads||0;
    if(col==='Platform Cost')return row.cost||0;
    var imp=row.impressions||0,clk=row.clicks||0,leads=row.leads||0,cost=row.cost||0,sends=row.sends||0;
    if(col==='CTR')return imp?clk/imp*100:(sends?clk/sends*100:'');
    if(col==='CR')return clk?leads/clk*100:'';
    if(col==='CPC')return clk?cost/clk:'';
    if(col==='CPL')return leads?cost/leads:'';
    return '';
  });
}
function initTotals(metrics,rows){
  var t={Sends:0,Opens:0,Clicks:0,Impressions:0,Leads:0,'Platform Cost':0};
  rows.forEach(function(r){t.Sends+=r.sends||0;t.Opens+=r.opens||0;t.Clicks+=r.clicks||0;t.Impressions+=r.impressions||0;t.Leads+=r.leads||0;t['Platform Cost']+=r.cost||0;});
  t['Open Rate']=t.Sends?t.Opens/t.Sends*100:'';t['CTOR']=t.Opens?t.Clicks/t.Opens*100:'';
  t['CTR']=t.Impressions?t.Clicks/t.Impressions*100:(t.Sends?t.Clicks/t.Sends*100:'');
  t['CR']=t.Clicks?t.Leads/t.Clicks*100:'';t['CPC']=t.Clicks?t['Platform Cost']/t.Clicks:'';t['CPL']=t.Leads?t['Platform Cost']/t.Leads:'';
  return t;
}
function isNumMetric(col){return['Sends','Opens','Clicks','Impressions','Leads','Platform Cost','Open Rate','CTR','CTOR','CR','CPC','CPL'].indexOf(col)>-1;}
function fmtVal(col,v){
  if(v===''||v===null||v===undefined)return'';
  if(['Sends','Opens','Clicks','Impressions','Leads'].indexOf(col)>-1)return Math.round(v).toLocaleString();
  if(['Open Rate','CTR','CTOR','CR'].indexOf(col)>-1)return parseFloat(v).toFixed(2)+'%';
  if(['CPC','CPL','Platform Cost'].indexOf(col)>-1)return'£'+parseFloat(v).toFixed(2);
  return String(v);
}
function fmtMonth(m){
  if(!m)return'';var p=m.split('/');
  if(p.length===2){var months=['January','February','March','April','May','June','July','August','September','October','November','December'];return months[parseInt(p[0],10)-1]+' '+p[1];}
  return m;
}
function parseMonth(m){if(!m)return 0;var p=m.split('/');if(p.length===2)return new Date(p[1]+'-'+p[0]+'-01').getTime();return new Date(m).getTime()||0;}
